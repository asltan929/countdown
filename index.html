<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>عد تنازلي</title>
<style>
  :root {
    --bg: #0b0d14;
    --card: #151925;
    --card-2: #1c2130;
    --text: #f4f5f8;
    --muted: #8a91a5;
    --accent: #ff6a3d;
    --accent-2: #ffb03d;
    --line: #262c3d;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #1a1f33 0%, var(--bg) 60%);
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, "Noto Sans Arabic", "Geeza Pro", Roboto, Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  /* ---------- Display ---------- */
  .display {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 5vw, 40px);
    text-align: center;
    padding: 24px 0;
  }
  #titleOut {
    font-size: clamp(22px, 6vw, 52px);
    font-weight: 800;
    line-height: 1.35;
    max-width: 22ch;
    word-wrap: break-word;
  }
  #targetOut {
    color: var(--muted);
    font-size: clamp(13px, 3.4vw, 17px);
    margin-top: -10px;
  }
  .timer {
    direction: ltr;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px, 2.5vw, 20px);
    width: 100%;
    max-width: 900px;
  }
  .unit {
    background: linear-gradient(180deg, var(--card-2), var(--card));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(14px, 4vw, 32px) 4px clamp(10px, 3vw, 22px);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .num {
    display: block;
    font-family: "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(34px, 12vw, 120px);
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    background: linear-gradient(180deg, #ffffff 0%, #c9cede 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lbl {
    display: block;
    margin-top: clamp(6px, 1.6vw, 12px);
    color: var(--muted);
    font-size: clamp(11px, 3vw, 16px);
    font-weight: 600;
    direction: rtl;
  }
  .done .num { background: linear-gradient(180deg, var(--accent-2), var(--accent)); -webkit-background-clip: text; background-clip: text; }
  #doneMsg {
    display: none;
    font-size: clamp(22px, 6vw, 44px);
    font-weight: 900;
    color: var(--accent-2);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .done #doneMsg { display: block; }
  @keyframes pulse { 50% { opacity: .45; transform: scale(.97); } }

  .empty {
    color: var(--muted);
    font-size: clamp(15px, 4vw, 19px);
    line-height: 1.8;
  }

  /* ---------- Toolbar ---------- */
  .bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 12px 20px;
    min-height: 46px;
    cursor: pointer;
    transition: transform .1s, background .2s;
  }
  button:active { transform: scale(.96); }
  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #1a0e05;
  }

  /* ---------- Settings sheet ---------- */
  .sheet-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .sheet-bg.open { display: flex; }
  .sheet {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px 24px 0 0;
    padding: 22px 18px max(22px, env(safe-area-inset-bottom));
    max-height: 92vh;
    overflow-y: auto;
    animation: up .25s ease-out;
  }
  @media (min-width: 600px) {
    .sheet-bg { align-items: center; }
    .sheet { border-radius: 24px; }
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 { font-size: 20px; margin-bottom: 18px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  input[type=text], input[type=date], input[type=time] {
    width: 100%;
    font: inherit;
    font-size: 16px; /* prevents iOS zoom */
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 14px;
    min-height: 50px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    color-scheme: dark;
  }
  input[type=date], input[type=time] { direction: ltr; text-align: center; }
  input:focus { border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chips button { padding: 8px 14px; min-height: 38px; font-size: 13px; background: var(--bg); }
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .actions button { flex: 1; }
  .err { color: #ff6b6b; font-size: 14px; min-height: 20px; margin-top: 4px; }
</style>
</head>
<body>

<main class="display" id="display">
  <div id="titleOut"></div>
  <div id="targetOut"></div>

  <div class="timer" id="timer" aria-live="polite">
    <div class="unit"><span class="num" id="d">00</span><span class="lbl">يوم</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="lbl">ساعة</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="lbl">دقيقة</span></div>
    <div class="unit"><span class="num" id="s">00</span><span class="lbl">ثانية</span></div>
  </div>

  <div id="doneMsg">🎉 انتهى العد التنازلي</div>
  <p class="empty" id="empty">اضغط «إعداد» لكتابة العنوان واختيار الوقت</p>
</main>

<div class="bar">
  <button class="primary" id="openBtn">⚙️ إعداد</button>
  <button id="fsBtn">⛶ ملء الشاشة</button>
  <button id="shareBtn">🔗 نسخ الرابط</button>
</div>

<div class="sheet-bg" id="sheetBg">
  <form class="sheet" id="form" autocomplete="off">
    <h2>إعداد العد التنازلي</h2>

    <div class="field">
      <label for="titleIn">العنوان</label>
      <input type="text" id="titleIn" maxlength="80" placeholder="مثال: باقي على إطلاق الآيفون">
    </div>

    <div class="field">
      <label>التاريخ والوقت</label>
      <div class="row">
        <input type="date" id="dateIn" required>
        <input type="time" id="timeIn" step="60" required>
      </div>
      <div class="chips">
        <button type="button" data-add="3600">+ ساعة</button>
        <button type="button" data-add="86400">+ يوم</button>
        <button type="button" data-add="604800">+ أسبوع</button>
        <button type="button" data-add="2592000">+ شهر</button>
      </div>
      <div class="err" id="err"></div>
    </div>

    <div class="actions">
      <button type="submit" class="primary">ابدأ</button>
      <button type="button" id="cancelBtn">إلغاء</button>
    </div>
  </form>
</div>

<script>
(function () {
  var KEY = 'countdown.v1';
  var $ = function (id) { return document.getElementById(id); };
  var state = { title: '', target: 0 };
  var timerId = null;

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // Format a timestamp with English digits, Arabic month/weekday names.
  function fmtTarget(ts) {
    var d = new Date(ts);
    try {
      return d.toLocaleString('ar-SA-u-nu-latn-ca-gregory', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    } catch (e) {
      return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
             ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
  }

  function load() {
    // URL hash takes priority so a shared link opens the same countdown.
    var h = location.hash.slice(1);
    if (h) {
      var p = {};
      h.split('&').forEach(function (kv) {
        var i = kv.indexOf('=');
        if (i > 0) p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
      });
      if (p.t && !isNaN(+p.t)) return { title: p.title || '', target: +p.t };
    }
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.target) return s;
    } catch (e) {}
    return { title: '', target: 0 };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    var hash = '#t=' + state.target + '&title=' + encodeURIComponent(state.title);
    try { history.replaceState(null, '', hash); } catch (e) {}
  }

  function render() {
    var has = !!state.target;
    $('empty').style.display = has ? 'none' : 'block';
    $('targetOut').textContent = has ? fmtTarget(state.target) : '';
    $('titleOut').textContent = state.title;
    document.title = state.title || 'عد تنازلي';
    tick();
  }

  function tick() {
    var diff = state.target ? Math.max(0, state.target - Date.now()) : 0;
    var t = Math.floor(diff / 1000);
    var d = Math.floor(t / 86400);
    $('d').textContent = pad(d);
    $('h').textContent = pad(Math.floor(t % 86400 / 3600));
    $('m').textContent = pad(Math.floor(t % 3600 / 60));
    $('s').textContent = pad(t % 60);
    $('display').classList.toggle('done', !!state.target && diff === 0);
  }

  function start() {
    if (timerId) clearInterval(timerId);
    render();
    // Align to whole seconds so the display flips cleanly.
    setTimeout(function () {
      tick();
      timerId = setInterval(tick, 1000);
    }, 1000 - (Date.now() % 1000));
  }

  // ---------- Settings sheet ----------
  function toInputs(ts) {
    var d = new Date(ts);
    $('dateIn').value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    $('timeIn').value = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fromInputs() {
    var dv = $('dateIn').value, tv = $('timeIn').value;
    if (!dv || !tv) return NaN;
    var a = dv.split('-'), b = tv.split(':');
    return new Date(+a[0], +a[1] - 1, +a[2], +b[0], +b[1], 0, 0).getTime();
  }

  function openSheet() {
    $('err').textContent = '';
    $('titleIn').value = state.title;
    toInputs(state.target && state.target > Date.now() ? state.target : Date.now() + 86400000);
    $('sheetBg').classList.add('open');
  }
  function closeSheet() { $('sheetBg').classList.remove('open'); }

  $('openBtn').onclick = openSheet;
  $('cancelBtn').onclick = closeSheet;
  $('sheetBg').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });

  Array.prototype.forEach.call(document.querySelectorAll('[data-add]'), function (b) {
    b.onclick = function () {
      var base = fromInputs();
      if (isNaN(base) || base < Date.now()) base = Date.now();
      toInputs(base + (+b.getAttribute('data-add')) * 1000);
    };
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var ts = fromInputs();
    if (isNaN(ts)) { $('err').textContent = 'اختر التاريخ والوقت'; return; }
    if (ts <= Date.now()) { $('err').textContent = 'الوقت المختار مضى، اختر وقتاً في المستقبل'; return; }
    state = { title: $('titleIn').value.trim(), target: ts };
    save();
    closeSheet();
    start();
  });

  // ---------- Fullscreen ----------
  $('fsBtn').onclick = function () {
    var el = document.documentElement;
    var isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (isFs) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(function () {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else {
      alert('ملء الشاشة غير مدعوم في هذا المتصفح. على الآيفون: شارك ← إضافة إلى الشاشة الرئيسية');
    }
  };

  // ---------- Copy link ----------
  $('shareBtn').onclick = function () {
    var url = location.href;
    var btn = this, old = btn.textContent;
    function ok() { btn.textContent = '✓ تم النسخ'; setTimeout(function () { btn.textContent = old; }, 1500); }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(ok, function () { prompt('انسخ الرابط:', url); });
    } else {
      prompt('انسخ الرابط:', url);
    }
  };

  // Re-sync after the phone wakes / tab returns.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });

  state = load();
  if (state.target) save();
  start();
  if (!state.target) openSheet();
})();
</script>
</body>
</html>
